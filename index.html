<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 Breaths</title>
<meta name="description" content="10 Breaths: a micro-meditation of ten breaths, and a kind community to share how it went.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #e8c7bc; --card: #f6e9e4; --ink: #3b2a2c; --ink-soft: #6f5557; --accent: #a85e4c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #241a1b; --card: #33262a; --ink: #f3e3dd; --ink-soft: #c9b1ab; --accent: #e0957f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 400 17px/1.6 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
  .card { background: var(--card); border-radius: 28px; padding: 40px 28px; max-width: 480px; width: 100%; text-align: center; }
  .mark { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .bar { width: 8px; height: 36px; border-radius: 4px; background: var(--ink); }
  .ring { width: 34px; height: 34px; border-radius: 50%; border: 7px solid var(--accent); }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.02em; font-weight: 700; }
  p { margin: 0 0 18px; color: var(--ink-soft); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="mark" aria-hidden="true"><span class="bar"></span><span class="ring"></span></div>
  <h1>10 Breaths</h1>
  <p>A micro-meditation of ten breaths to shift how you feel, and a kind community to share how it went.</p>
  <a href="/privacypolicy/">Privacy Policy</a> · <a href="/delete-account/">Delete your account</a>
</div>
</body>
</html>
